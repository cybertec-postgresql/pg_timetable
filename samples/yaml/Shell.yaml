# Shell/Program task example
# Equivalent to samples/Shell.sql

chains:
  - name: "psql chain" 
    schedule: "* * * * *"  # Every minute
    live: true
    
    tasks:
      - name: "Run psql command"
        kind: "PROGRAM"
        command: "psql"
        parameters:
          - - "-h"
            - "localhost"  # Replace with the target host
            - "-p"
            - "5432"       # Replace with the target port
            - "-d"
            - "postgres"   # Replace with the target database
            - "-U"
            - "postgres"   # Replace with the target user
            - "-w"
            - "-c"
            - "SELECT now();"