name: Build and Test

permissions:
  contents: write
  packages: write
  pages: write

on:
  push:
    branches:
      - master
  pull_request:
    paths-ignore: ['docs/**', 'mkdocs.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true    

# The Linux job uses testcontainers-go for full PostgreSQL integration testing.
# The Windows job covers the OS-specific code paths (service/notify) that are
# guarded by //go:build windows and cannot be exercised on Linux. It runs only
# the Docker-free unit tests, since Windows runners have no Linux containers.
# Both jobs feed Coveralls as parallel builds that are finalized in `coverage`.

jobs:

  test:
    if: true # false to skip job during debug
    name: Test and Build with Testcontainers
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Golang
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Get dependencies
      run: |
        go mod download
        go version

    - name: GolangCI-Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        
    - name: Test with Testcontainers
      run: go test -failfast -v -timeout=300s -coverprofile=profile.cov ./...

    - name: Send coverage to Coveralls (parallel)
      uses: coverallsapp/github-action@v2
      with:
        file: profile.cov
        flag-name: linux
        parallel: true

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v7
      with:
        version: latest
        args: release --snapshot --skip=publish --clean --config .goreleaser.ci.yml

  test-windows:
    if: true # false to skip job during debug
    name: Test Windows-specific code
    runs-on: windows-latest
    steps:

    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Golang
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Get dependencies
      run: |
        go mod download
        go version

    # Only the packages that carry //go:build windows code and whose tests do
    # not require Docker. The DB integration tests (testcontainers) live in the
    # other packages and are already covered by the Linux job.
    - name: Test Windows units
      run: >-
        go test -failfast -v -timeout=120s -coverprofile=profile.cov
        . ./internal/notify/...

    - name: Send coverage to Coveralls (parallel)
      uses: coverallsapp/github-action@v2
      with:
        file: profile.cov
        flag-name: windows
        parallel: true

  coverage:
    if: always()
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [test, test-windows]
    steps:

    - name: Finalize parallel Coveralls build
      uses: coverallsapp/github-action@v2
      with:
        parallel-finished: true
        carryforward: "linux,windows"

  build-docs:
    if: true # false to skip job during debug
    needs: [test]
    name: Build Docs
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@v7

    - name: Configure Git
      run: |
        git config user.name "${GITHUB_ACTOR}"
        git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

    - name: Set up Golang
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'      
    
    - name: Set up gopages
      run: go install github.com/johnstarich/go/gopages@v0.1.29
    
    - name: Build Developer Docs
      run: gopages -out "docs/godoc" -base "/pg_timetable/devel/godoc" -internal

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.13
        cache: 'pip'
        cache-dependency-path: '**/requirements-doc.txt'

    - name: Install dependencies
      run: pip install -r requirements-doc.txt

    - name: Check if we should push to gh-pages
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      run: |
        git fetch origin gh-pages --depth=1
        echo "push_opt=--push" >> $GITHUB_ENV 

    - name: Build mkdocs
      run: mike deploy ${{ env.push_opt }} devel

  test-docker-images:
    if: true # false to skip job during debug
    needs: [test]
    name: Test Docker Image Build
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@v7

    - name: Prepare build metadata
      id: meta
      run: |
        echo "GIT_HASH=${{ github.sha }}" >> $GITHUB_OUTPUT
        echo "GIT_TIME=$(git show -s --format=%cI HEAD)" >> $GITHUB_OUTPUT
        echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
    
    - name: Test build Docker image (fast, amd64 only)
      uses: ./.github/actions/build-docker
      with:
        dockerfile: Dockerfile
        image-name: cybertecpostgresql/pg_timetable
        platforms: linux/amd64
        push: 'false'
        cache-scope: test-build
        build-args: |
          COMMIT=${{ steps.meta.outputs.GIT_HASH }}
          DATE=${{ steps.meta.outputs.GIT_TIME }}
          VERSION=${{ steps.meta.outputs.VERSION }}
