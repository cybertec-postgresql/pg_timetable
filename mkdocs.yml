site_name: 🕰️ pg_timetable
site_description: Advanced job scheduler for PostgreSQL
site_url: https://cybertec-postgresql.github.io/pg_timetable/
repo_url: https://github.com/cybertec-postgresql/pg_timetable
repo_name: cybertec-postgresql/pg_timetable
copyright: Made by and for PostgreSQL lovers! 🐘❤️

theme:
  name: material
  language: en
  include_search_page: false
  search_index_only: true
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)" # Light mode
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/lightbulb-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)" # Dark mode
      scheme: slate
      primary: light blue
      accent: indigo
      toggle:
        icon: material/lightbulb
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Tutorial:
    - Your First Scheduled Chain: tutorial-first-chain.md
    - Your First YAML Chain: tutorial-your-first-yaml-chain.md
    - Handling Chain Errors: tutorial-handling-chain-errors.md
  - How-to Guides:
    - Install pg_timetable: installation.md
    - Schedule Common Jobs: how-to-schedule-common-jobs.md
    - Run Sample Chains: samples.md
    - Migrate from Other Schedulers: migration.md
    - Define Chains in YAML: how-to-write-yaml-chains.md
    - Use the Secret Store: how-to-use-secret-store.md
    - Enable OpenTelemetry: how-to-enable-opentelemetry.md
  - Reference:
    - REST API: api.md
    - Command-Line Reference: reference-cli-options.md
    - Commands, Tasks, and Chains: reference-commands-tasks-chains.md
    - YAML Chain Schema: yaml-format.md
    - Database Schema: database_schema.md
    - Secret Store: secret_store.md
    - OpenTelemetry Reference: reference-opentelemetry.md
  - Concept:
    - Project Background: background.md
    - The Scheduling Model: explanation-scheduling-model.md
    - Secret Store Security Model: explanation-secret-store-security-model.md
  - Developer:
    - License: license.md
    - Documentation: ../devel/godoc/index.html

extra:
  version:
    provider: mike
    alias: true